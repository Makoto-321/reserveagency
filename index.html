<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予約ができない、を変えていく｜カケハビ</title>
<meta name="description" content="電話でしか予約を受けていないお店に、カケハビが代わりに電話します。テスト運用中につき無料。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --ink:#000000;
  --ink-2:#41474f;
  --ink-3:#878e97;
  --rule:#dfe3e8;
  --mist:#f4f6f8;
  --blue:#1447e6;
  --blue-deep:#0a2472;
  --blue-mist:#eaf0ff;
  --measure:34em;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:16px;
  line-height:1.85;
  font-feature-settings:"palt" 1;
}
html[lang=en] body{line-height:1.7}
html[lang=en]{--measure:32em}
.wrap{width:min(100% - 2.5rem, 62rem);margin-inline:auto}
h1,h2,h3{font-family:"Shippori Mincho B1","Yu Mincho",serif;font-weight:800;line-height:1.28;letter-spacing:.01em;margin:0}

/* ---------- language ---------- */
.langbar{display:flex;justify-content:flex-end;padding-top:1.4rem}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.lang button{font:inherit;font-size:.8rem;font-weight:500;padding:.34rem .85rem;background:#fff;color:var(--ink-2);border:none;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.lang button:hover{background:var(--blue-mist);color:var(--blue-deep)}
.lang button[aria-pressed=true]:hover{background:var(--ink);color:#fff}

/* ---------- hero ---------- */
.hero{padding:clamp(3rem,9vh,5rem) 0 clamp(3.5rem,9vh,6rem)}
.hero h1{font-size:clamp(2.4rem,7.4vw,5.4rem);letter-spacing:-.015em}
.hero h1 span{display:block}
.line-wrap{margin:2.4rem 0 1.1rem;height:2px;background:var(--rule);position:relative;overflow:hidden}
.line-wrap i{position:absolute;inset:0;background:var(--blue);transform:scaleX(0);transform-origin:left;animation:dial 2.2s cubic-bezier(.22,.9,.3,1) .35s forwards}
@keyframes dial{to{transform:scaleX(1)}}
.status{font-size:.82rem;color:var(--ink-3);letter-spacing:.06em;min-height:1.6em}
.status b{color:var(--blue);font-weight:700;opacity:0;animation:show .5s ease 2.5s forwards}
.status i{font-style:normal;opacity:1;animation:hide .3s ease 2.4s forwards}
@keyframes show{to{opacity:1}}
@keyframes hide{to{opacity:0;display:none}}
.lede{max-width:var(--measure);margin:1.6rem 0 0;font-size:1.06rem;color:var(--ink-2)}
.free{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.7rem;padding:.42rem .9rem;background:var(--blue-mist);color:var(--blue-deep);font-size:.86rem;font-weight:700;border-radius:2px}
.free::before{content:"";width:7px;height:7px;background:var(--blue);border-radius:50%;flex:none}
.jump{display:inline-block;margin-top:2.6rem;padding:1rem 2rem;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:1rem;border-radius:2px}
.jump:hover{background:var(--blue)}

/* ---------- steps ---------- */
.steps{border-top:1px solid var(--rule);padding:clamp(3rem,7vw,5rem) 0}
.steps h2{font-size:clamp(1.5rem,3.2vw,2.1rem);margin-bottom:2.6rem}
.step{display:grid;grid-template-columns:2.6rem 1fr;gap:1.2rem;padding:1.5rem 0;border-top:1px solid var(--rule)}
.step:first-of-type{border-top:none}
.step .n{font-family:"Shippori Mincho B1",serif;font-size:1.35rem;font-weight:800;color:var(--blue);line-height:1.5}
.step h3{font-size:1.1rem;font-weight:700;font-family:inherit;margin-bottom:.2rem}
.step p{margin:0;color:var(--ink-2);font-size:.96rem;max-width:var(--measure)}

/* ---------- form ---------- */
.formzone{background:var(--mist);padding:clamp(3.5rem,8vw,6rem) 0}
.card{background:#fff;padding:clamp(1.6rem,4vw,3.2rem);max-width:44rem;border-radius:3px}
.card h2{font-size:clamp(1.45rem,3vw,1.95rem)}
p.intro{color:var(--ink-2);margin:.9rem 0 2.4rem;font-size:.97rem;max-width:var(--measure)}
.f{margin-bottom:2.1rem}
.f label{display:block;font-weight:700;font-size:.95rem;margin-bottom:.35rem}
.req{margin-left:.55rem;font-size:.72rem;font-weight:500;color:var(--blue);border:1px solid var(--blue);padding:.05rem .38rem;border-radius:2px;vertical-align:.1em}
.opt{margin-left:.55rem;font-size:.72rem;font-weight:500;color:var(--ink-3)}
.hint{font-size:.83rem;color:var(--ink-2);line-height:1.7;margin:.1rem 0 .7rem;max-width:var(--measure)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],textarea{
  width:100%;font:inherit;font-size:1rem;color:var(--ink);background:transparent;
  border:none;border-bottom:1.5px solid var(--rule);border-radius:0;
  padding:.6rem .1rem;transition:border-color .15s;
}
textarea{border:1.5px solid var(--rule);padding:.7rem;resize:vertical;min-height:6.5rem;border-radius:2px}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
input:focus-visible{box-shadow:0 2px 0 0 var(--blue)}
textarea:focus-visible{box-shadow:0 0 0 1px var(--blue)}
.row{display:flex;gap:1.2rem;flex-wrap:wrap}
.row>div{flex:1 1 9rem}
.consent{background:var(--blue-mist);padding:1.2rem 1.3rem;border-radius:2px;margin-bottom:1.9rem}
.consent .line{display:flex;gap:.75rem;align-items:flex-start}
.consent input{margin-top:.42rem;width:1.05rem;height:1.05rem;accent-color:var(--blue);flex:none}
.consent label{font-weight:500;font-size:.88rem;line-height:1.75}
.consent label a{color:var(--blue-deep);font-weight:700;text-underline-offset:.22em;text-decoration-thickness:1px}
.consent label a:hover{color:var(--blue)}
.consent .err{margin:.6rem 0 0 1.8rem}
button[type=submit]{width:100%;font:inherit;font-weight:700;font-size:1.02rem;padding:1.1rem;background:var(--ink);color:#fff;border:none;border-radius:2px;cursor:pointer}
button[type=submit]:hover{background:var(--blue)}
button[type=submit]:disabled{background:var(--ink-3);cursor:progress}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:#b3261e;font-size:.85rem;margin-top:.4rem;display:none}
.f.bad input,.f.bad textarea{border-color:#b3261e}
.f.bad .err{display:block}
.done{display:none}
.done h2{margin-bottom:1rem}
.done p{color:var(--ink-2);max-width:var(--measure)}
footer{padding:3rem 0 4rem;border-top:1px solid var(--rule);font-size:.83rem;color:var(--ink-3);line-height:1.9}
footer p{max-width:var(--measure)}
footer a{color:var(--ink-2)}
footer .co{margin-top:1.2rem}
footer .co b{color:var(--ink-2);font-weight:700}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .line-wrap i{transform:scaleX(1)}
  .status i{display:none}.status b{opacity:1}
}
</style>
</head>

          <div class="f">
            <label><span data-t="lWhen"></span><span class="req" data-t="reqTag"></span></label>

            <div class="row">
              <div><input type="date" id="date" name="entry.2222222222" aria-label="date"></div>

            </div>

          </div>

          <div class="f">
            <label for="people"><span data-t="lPeople"></span><span class="req" data-t="reqTag"></span></label>
            <input type="number" id="people" name="entry.4444444444" min="1" max="30" inputmode="numeric" placeholder="2">
            <p class="err" data-t="ePeople"></p>
          </div>

          <div class="f">
            <label for="name"><span data-t="lName"></span><span class="req" data-t="reqTag"></span></label>

            </div>
            <p class="err" id="okerr" data-t="eOk"></p>
          </div>

          <button type="submit" id="go" data-t="submit"></button>
        </form>
        <noscript><p class="hint" data-t="nojs"></p></noscript>
      </div>

      <div class="done" id="doneview">
        <h2 data-t="doneTitle"></h2>
        <p data-t="doneP1"></p>
        <p data-t="doneP2"></p>
      </div>

    </div>
  </div>
</section>

<footer class="wrap">
  <p data-t="footNote"></p>

    <a href="mailto:shukanapplication@gmail.com">shukanapplication@gmail.com</a>
  </p>
</footer>

<iframe name="sink" style="display:none" title="submit target"></iframe>

 formIntro:"This service is in testing. There is no charge for using it. Your bill at the restaurant, your own phone and data charges, and any other costs you incur are your own responsibility.",

 lShop:"Restaurant name", hShop:"Please add the area or nearest station, since many restaurants share a name. Example: Torimasa, Ebisu", eShop:"Please enter the restaurant name",

var lang="ja";
function apply(l){
  lang=l;
  var d=T[l];
  document.documentElement.lang=l;
  document.title=d.title;
  document.getElementById("h1").innerHTML="<span>"+d.h1[0]+"</span><span>"+d.h1[1]+"</span>";
  document.querySelectorAll("[data-t]").forEach(function(el){
    el.innerHTML = d[el.getAttribute("data-t")] || "";
  });
  document.getElementById("langfield").value=l;
  document.getElementById("btn-ja").setAttribute("aria-pressed", l==="ja");
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  try{ localStorage.setItem("kh_lang", l); }catch(e){}
}
document.getElementById("btn-ja").onclick=function(){ apply("ja"); };
document.getElementById("btn-en").onclick=function(){ apply("en"); };

var saved=null; try{ saved=localStorage.getItem("kh_lang"); }catch(e){}
apply(saved || ((navigator.language||"ja").slice(0,2)==="ja" ? "ja" : "en"));

(function(){
  var form=document.getElementById('req'),
      ok=document.getElementById('ok'),
      okerr=document.getElementById('okerr'),
      go=document.getElementById('go'),
      opened=Date.now(), sent=false;

  document.querySelectorAll('.consent label a').forEach(function(a){
    a.addEventListener('click',function(ev){ ev.stopPropagation(); });
  });

  function bad(el,on){ el.closest('.f').classList.toggle('bad',on); return !on; }

  form.addEventListener('submit',function(e){
    var v=true;
    v = bad(document.getElementById('shop'), !document.getElementById('shop').value.trim()) && v;
    var d=document.getElementById('date'), t=document.getElementById('time');
    v = bad(d, !(d.value && t.value)) && v;
    var p=document.getElementById('people');
    v = bad(p, !(p.value && +p.value>0)) && v;
    v = bad(document.getElementById('name'), !document.getElementById('name').value.trim()) && v;
    var tel=document.getElementById('tel');
    v = bad(tel, !/^[0-9+\-\s()]{10,}$/.test(tel.value.trim())) && v;

    okerr.style.display = ok.checked ? 'none' : 'block';
    if(!ok.checked) v=false;

    if(document.getElementById('company').value !== '') v=false;
    if(Date.now()-opened < 3000) v=false;

    if(!v){
      e.preventDefault();
      var first=form.querySelector('.bad input, .bad textarea');
      if(first){ first.focus(); } else { ok.focus(); }
      return;
    }
    sent=true;
    go.disabled=true;
    go.textContent = (lang==="ja") ? "送信しています…" : "Sending…";
  });

  document.querySelector('iframe[name=sink]').addEventListener('load',function(){
    if(!sent) return;
    document.getElementById('formview').style.display='none';
    var done=document.getElementById('doneview');
    done.style.display='block';
    done.setAttribute('tabindex','-1');
    done.focus();
    done.scrollIntoView({behavior:'smooth',block:'center'});
  });
})();
</script>
</body>
</html>
